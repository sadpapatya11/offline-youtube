name: Flutter CI/CD - Tam Güvenlik ve Gizlilik Taraması

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ═══════════════════════════════════════════════════
  # ADIM 1: Flutter Test, Analyze & APK Derleme
  # ═══════════════════════════════════════════════════
  build_and_test:
    name: "🧪 Flutter Test & APK Build"
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.22.x'
        channel: 'stable'
        cache: true

    - name: Install dependencies
      run: flutter pub get

    - name: "🔍 Flutter Analyze (Kod Kalitesi)"
      run: flutter analyze

    - name: "✅ Flutter Test (Otomatik Testler)"
      run: flutter test

    - name: "📦 Release APK Derleme"
      run: flutter build apk --release

    - name: Upload APK for security jobs
      uses: actions/upload-artifact@v4
      with:
        name: release-apk
        path: build/app/outputs/flutter-apk/app-release.apk
        retention-days: 7

  # ═══════════════════════════════════════════════════
  # ADIM 2: Özel SAST Tarayıcımız (Kaynak Kod Analizi)
  # ═══════════════════════════════════════════════════
  custom_sast:
    name: "🛡️ Özel SAST & Manifest Güvenlik Taraması"
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.22.x'
        channel: 'stable'
        cache: true

    - name: Install Flutter dependencies
      run: flutter pub get

    - name: "🛡️ Yerel Güvenlik ve Regresyon Tarayıcısı"
      run: python scripts/security_and_regression_scan.py
      env:
        CI: true

  # ═══════════════════════════════════════════════════
  # ADIM 3: MobSF Statik Güvenlik Analizi (Docker)
  # ═══════════════════════════════════════════════════
  mobsf_scan:
    name: "🔒 MobSF APK Güvenlik & Gizlilik Analizi"
    runs-on: ubuntu-latest
    needs: build_and_test

    services:
      mobsf:
        image: opensecurity/mobile-security-framework-mobsf:latest
        ports:
          - 8000:8000
        env:
          MOBSF_API_KEY: "cicd_mobsf_key_2026"

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Download APK artifact
      uses: actions/download-artifact@v4
      with:
        name: release-apk
        path: ./apk

    - name: "⏳ MobSF servisinin hazır olmasını bekle"
      run: |
        echo "MobSF başlatılıyor..."
        for i in $(seq 1 60); do
          if curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/ | grep -q "200"; then
            echo "MobSF hazır!"
            break
          fi
          echo "Bekleniyor... ($i/60)"
          sleep 3
        done

    - name: "📤 APK'yı MobSF'e yükle"
      id: upload
      run: |
        RESPONSE=$(curl -s -X POST \
          http://localhost:8000/api/v1/upload \
          -H "Authorization: cicd_mobsf_key_2026" \
          -F "file=@./apk/app-release.apk")
        echo "Upload yanıtı: $RESPONSE"
        HASH=$(echo "$RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin).get('hash',''))")
        echo "hash=$HASH" >> $GITHUB_OUTPUT
        if [ -z "$HASH" ]; then
          echo "::error::MobSF'e APK yüklenemedi!"
          exit 1
        fi
        echo "APK hash: $HASH"

    - name: "🔍 MobSF Statik Tarama Başlat"
      run: |
        curl -s -X POST \
          http://localhost:8000/api/v1/scan \
          -H "Authorization: cicd_mobsf_key_2026" \
          -d "hash=${{ steps.upload.outputs.hash }}"
        echo "Statik tarama tamamlandı."

    - name: "📊 MobSF Güvenlik Raporu Al ve Değerlendir"
      run: |
        # Scorecard al
        SCORECARD=$(curl -s -X POST \
          http://localhost:8000/api/v1/scorecard \
          -H "Authorization: cicd_mobsf_key_2026" \
          -d "hash=${{ steps.upload.outputs.hash }}")
        echo "=== MobSF Scorecard ==="
        echo "$SCORECARD" | python3 -m json.tool || echo "$SCORECARD"
        
        # JSON rapor al
        REPORT=$(curl -s -X POST \
          http://localhost:8000/api/v1/report_json \
          -H "Authorization: cicd_mobsf_key_2026" \
          -d "hash=${{ steps.upload.outputs.hash }}")
        
        # Güvenlik skorunu çek
        SCORE=$(echo "$SCORECARD" | python3 -c "import sys,json; print(json.load(sys.stdin).get('security_score', 0))" 2>/dev/null || echo "0")
        echo ""
        echo "══════════════════════════════════════"
        echo "  MobSF GÜVENLİK SKORU: $SCORE / 100"
        echo "══════════════════════════════════════"
        
        # Kritik bulguları çek
        echo ""
        echo "=== Kritik Güvenlik Bulguları ==="
        echo "$REPORT" | python3 -c "
import sys, json
try:
    data = json.load(sys.stdin)
    # Manifest analizi
    manifest = data.get('manifest_analysis', [])
    critical_count = 0
    if isinstance(manifest, list):
        for item in manifest:
            severity = item.get('severity', '').lower()
            if severity in ('high', 'danger'):
                critical_count += 1
                print(f'  ❌ [{severity.upper()}] {item.get(\"title\", \"\")}')
                print(f'     {item.get(\"description\", \"\")[:200]}')
    
    # Code analizi
    code_analysis = data.get('code_analysis', {})
    if isinstance(code_analysis, dict):
        for key, val in code_analysis.items():
            if isinstance(val, dict):
                severity = val.get('severity', '').lower()
                if severity in ('high', 'danger'):
                    critical_count += 1
                    print(f'  ❌ [{severity.upper()}] {val.get(\"description\", key)[:200]}')
    
    # Ağ güvenliği
    urls = data.get('urls', [])
    insecure_urls = [u for u in urls if isinstance(u, dict) and u.get('url', '').startswith('http://')]
    if insecure_urls:
        critical_count += 1
        print(f'  ⚠️  {len(insecure_urls)} adet güvensiz HTTP URL tespit edildi')
    
    if critical_count == 0:
        print('  ✅ Kritik güvenlik bulgusu yok!')
except Exception as e:
    print(f'Rapor okunamadı: {e}')
" 2>/dev/null || echo "Rapor ayrıştırılamadı"

    - name: "📋 PDF Güvenlik Raporu Oluştur"
      continue-on-error: true
      run: |
        curl -s -X POST \
          http://localhost:8000/api/v1/download_pdf \
          -H "Authorization: cicd_mobsf_key_2026" \
          -d "hash=${{ steps.upload.outputs.hash }}" \
          -o mobsf_security_report.pdf
        echo "PDF rapor oluşturuldu."

    - name: MobSF raporunu artifact olarak kaydet
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: mobsf-security-report
        path: mobsf_security_report.pdf
        retention-days: 30

  # ═══════════════════════════════════════════════════
  # ADIM 4: Semgrep ile Gelişmiş SAST (GitHub Reposu)
  # ═══════════════════════════════════════════════════
  semgrep_scan:
    name: "🔎 Semgrep SAST (Gelişmiş Kod Taraması)"
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: "🔎 Semgrep ile tüm kaynak kodu tara"
      uses: semgrep/semgrep-action@v1
      with:
        config: >-
          p/security-audit
          p/secrets
          p/owasp-top-ten
      env:
        SEMGREP_APP_TOKEN: ""

  # ═══════════════════════════════════════════════════
  # ADIM 5: Dependency (Bağımlılık) Güvenlik Taraması
  # ═══════════════════════════════════════════════════
  dependency_scan:
    name: "📦 Bağımlılık Zafiyet Taraması (OSV-Scanner)"
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: "📦 OSV-Scanner ile bağımlılık zafiyetlerini tara"
      uses: google/osv-scanner-action/osv-scanner-action@v2
      with:
        scan-args: |-
          --recursive
          ./
      continue-on-error: true

  # ═══════════════════════════════════════════════════
  # ADIM 6: Nihai Başarı Raporu
  # ═══════════════════════════════════════════════════
  final_report:
    name: "📋 Nihai Güvenlik Raporu"
    runs-on: ubuntu-latest
    needs: [build_and_test, custom_sast, mobsf_scan, semgrep_scan, dependency_scan]
    if: always()

    steps:
    - name: "📋 Tüm sonuçları raporla"
      run: |
        echo "══════════════════════════════════════════════════"
        echo "           NİHAİ GÜVENLİK ve TEST RAPORU"
        echo "══════════════════════════════════════════════════"
        echo ""
        echo "  Flutter Test & Build:      ${{ needs.build_and_test.result }}"
        echo "  Özel SAST Tarayıcı:        ${{ needs.custom_sast.result }}"
        echo "  MobSF Güvenlik Analizi:    ${{ needs.mobsf_scan.result }}"
        echo "  Semgrep SAST:              ${{ needs.semgrep_scan.result }}"
        echo "  Bağımlılık Taraması:       ${{ needs.dependency_scan.result }}"
        echo ""
        echo "══════════════════════════════════════════════════"
        
        # Kritik joblar başarısızsa hata ver
        if [[ "${{ needs.build_and_test.result }}" == "failure" || \
              "${{ needs.custom_sast.result }}" == "failure" || \
              "${{ needs.mobsf_scan.result }}" == "failure" ]]; then
          echo ""
          echo "❌ KRİTİK HATALAR TESPİT EDİLDİ! Dağıtım engellendi."
          exit 1
        fi
        
        echo ""
        echo "✅ TÜM KRİTİK TESTLER VE GÜVENLİK TARAMALARI BAŞARILI!"
